# Only send `Connection: upgrade` when the client actually asked to upgrade
# (WebSocket). Hard-coding "upgrade" sends the header on every plain request,
# which is off-spec and blocks upstream keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP only (no TLS yet) ----------
# This config serves the app directly over port 80. There is no HTTPS server
# block and no redirect, so it works on a fresh host with no certificates and
# no domain name (reachable by raw IP).
#
# When you are ready to add TLS: obtain a cert for the real hostname, then
# restore the 80 -> 443 redirect + a `listen 443 ssl` block. Keep the
# /.well-known/acme-challenge/ location below so http-01 renewal keeps working.
server {
    listen 80 default_server;
    # `_` matches any Host header, including a bare IP address.
    server_name _;

    # Let's Encrypt http-01 verification (harmless before you have a cert).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck target.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # nginx default is 1MB, which causes "413 Request Entity Too Large".
    #
    # The app-level limit is 20MB of raw file (lib/upload-limits.ts). This value
    # must sit above it, not equal to it: chat images and podcast audio travel as
    # base64 data URLs inside a JSON body, and base64 inflates by 4/3, so a 20MB
    # attachment becomes a ~27MB request body. 32M leaves room for that plus the
    # surrounding JSON (conversation history) and multipart headers.
    #
    # Keep in sync with MAX_UPLOAD_BYTES in lib/upload-limits.ts.
    client_max_body_size 32M;

    # Use Docker's embedded DNS so the `app` service name re-resolves
    # to all replica container IPs (round-robin load balancing).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy everything to the Next.js container(s)
    location / {
        # Variable proxy_pass forces DNS re-resolution at request time,
        # which is required for `docker compose --scale app=N` to work.
        set $backend "http://app:3000";
        proxy_pass $backend;
        proxy_http_version 1.1;

        # WebSocket / streaming support (SSE for AI chat)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for streaming AI responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
