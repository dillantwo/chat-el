# Only send `Connection: upgrade` when the client actually asked to upgrade
# (WebSocket). Hard-coding "upgrade" sends the header on every plain request,
# which is off-spec and blocks upstream keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP: ACME challenge + redirect to HTTPS ----------
server {
    listen 80 default_server;
    server_name aielafp.eduhk.hk;

    # Let's Encrypt http-01 renewal. nginx owns port 80, so host renewals must
    # run as `certbot renew --webroot -w /var/www/certbot`; --standalone would
    # fail to bind. This location must stay reachable over plain HTTP, above the
    # redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck target. Lives on the HTTP server so the probe does
    # not follow a redirect to the public HTTPS hostname from inside the
    # container, where that name may not resolve.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    # nginx 1.25+ moved http2 out of the `listen` directive into its own.
    http2 on;
    server_name aielafp.eduhk.hk;

    ssl_certificate     /etc/letsencrypt/live/aielafp.eduhk.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aielafp.eduhk.hk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # AEAD-only cipher list for TLS 1.2. The previous `HIGH:!aNULL:!MD5` also
    # accepted CBC-mode suites (ECDHE-ECDSA-AES256-SHA384 and friends), which
    # vulnerability scanners flag for padding-oracle attacks (POODLE, Lucky13).
    # GCM and ChaCha20-Poly1305 are authenticated modes and have no such issue.
    # Every suite here is ECDHE, so all sessions have forward secrecy.
    # TLS 1.3's suites are not configurable via ssl_ciphers and are AEAD by
    # design, so nothing extra is needed for it.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # Session tickets are encrypted with a key that lives as long as the worker,
    # which weakens forward secrecy. The session cache above already covers
    # resumption for this workload.
    ssl_session_tickets off;

    # Tell browsers to always use HTTPS for this host for the next year.
    # `always` also emits it on error responses. Note this is sticky in the
    # browser: do not enable if you ever need to serve this host over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # nginx default is 1MB, which causes "413 Request Entity Too Large".
    #
    # The app-level limit is 20MB of raw file (lib/upload-limits.ts). This value
    # must sit above it, not equal to it: chat images and podcast audio travel as
    # base64 data URLs inside a JSON body, and base64 inflates by 4/3, so a 20MB
    # attachment becomes a ~27MB request body. 32M leaves room for that plus the
    # surrounding JSON (conversation history) and multipart headers.
    #
    # Keep in sync with MAX_UPLOAD_BYTES in lib/upload-limits.ts.
    client_max_body_size 32M;

    # Use Docker's embedded DNS so the `app` service name re-resolves
    # to all replica container IPs (round-robin load balancing).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy everything to the Next.js container(s)
    location / {
        # Variable proxy_pass forces DNS re-resolution at request time,
        # which is required for `docker compose --scale app=N` to work.
        set $backend "http://app:3000";
        proxy_pass $backend;
        proxy_http_version 1.1;

        # WebSocket / streaming support (SSE for AI chat)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for streaming AI responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
